<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniCart</title>
  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://kit.fontawesome.com/a96968d74f.js" crossorigin="anonymous"></script>
</head>

<body>
  <header class="w-11/12 mx-auto">
    <div class="navbar bg-base-100 text-blue-700">
      <div class="navbar-start">
        <a class="btn btn-ghost text-2xl font-bold">UniCart</a>
      </div>
      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1 text-xl">
          <li><a>Home</a></li>
          <li><a>Products</a></li>
          <li><a>About</a></li>
          <li><a>Contact</a></li>
        </ul>
      </div>
      <div class="navbar-end text-xl">
        <i class="fa-solid fa-cart-arrow-down"></i>
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
            </svg>
          </div>
          <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-25 p-2 shadow">
            <li><a>Home</a></li>
            <li><a>Products</a></li>
            <li><a>About</a></li>
            <li><a>Contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="banner" class="relative h-120 bg-[url('./Assets/banner-image.png')] bg-center bg-no-repeat bg-cover">
      <div class="absolute inset-0 bg-linear-to-r from-black via-slate-400/10 to-black/80">

        <div class="text-white w-10/12 mx-auto py-40">
          <h1 class="text-3xl md:text-5xl font-bold">Best Collection for You</h1>
          <p class="md:w-1/2 py-4">Discover the latest trends in fashion, electronics, and more. Shop with confidence and style at UniCart.</p>
          <button class="btn btn-primary">Shop Now</button>
        </div>


      </div>
    </section>
    

  </main>

  <footer>

  </footer>

  <!-- scripts -->
  <script src="scripts/script.js"></script>
</body>

</html>
